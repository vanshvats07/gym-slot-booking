<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Slot Booking | Sessions</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/sessions.html">Gym Slot Booking</a>
    <nav>
      <a href="/sessions.html" aria-current="page">Sessions</a>
      <a href="/bookings.html">My bookings</a>
      <a href="/admin.html" data-admin-only hidden>Admin</a>
      <button id="logoutBtn" class="link-button">Log out</button>
    </nav>
  </header>
  <main class="container">
    <section class="page-heading">
      <p class="eyebrow">MEMBER AREA</p>
      <h1>Sessions</h1>
      <p class="muted">Hi <strong data-user-name>member</strong>. Choose an upcoming session. Seat counts refresh every 15 seconds.</p>
    </section>
    <section class="toolbar">
      <label for="dateFilter">Filter by date (IST)</label>
      <input id="dateFilter" type="date">
      <a class="text-link" href="/bookings.html">View my bookings →</a>
    </section>
    <div id="sessionMessage" class="message" aria-live="polite" hidden></div>
    <section id="sessionsList" class="stack" aria-live="polite"><p>Loading sessions…</p></section>
  </main>
  <footer>Sessions are one hour long · Capacity is limited to 20 people</footer>
  <script src="/js/api.js"></script>
  <script src="/js/session-time.js"></script>
  <script src="/js/sessions.js"></script>
</body>
</html>
